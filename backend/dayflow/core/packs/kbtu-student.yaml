# Default skill pack. Everything KBTU-specific lives here, not in code.
# The vault is the user's Google Drive folder "Dayflow/<course code> <course name>/<Materials|Week NN|Lab NN>/".
name: kbtu-student
skills:
  - id: vault-sync
    key: "1"
    title: Sync WSP files to vault
    blurb: Walk a course's file directory on WSP and download every file into the Drive vault, parsed and indexed.
    prompt: Sync all course files from WSP into my vault and tell me what changed.
    keywords: [sync, wsp, vault, files, download, mirror, changed]
    sites: [wsp.kbtu.kz]
    tools: [open_tab, read_page, click, press_key, scroll, download, download_many, wait, screenshot, vault_list, vault_read]
    schedule: "0 8 * * *"
    instructions: |
      Once you know several file URLs, call download_many(items=[{url, path}, ...]) ONCE instead of download per
      file — it runs them in parallel and costs one model turn instead of one per file.
      Goal: mirror the requested course's files from WSP "Student files" into the vault
      ("<course code> <course name>/<Materials|Week NN|Lab NN>/<file>"), then confirm the index.
      The WSP tree: Desktop → "Student files" → School → Instructor (Surname Name) → course folder → files.
      Steps:
      1. open_tab the portal's Student files page (or the Desktop, then click "Student files") and read_page.
      2. The folder browser is a table with Back and Enter buttons and no links. To open a folder: click its
         row (this only selects it), then click the Enter button right away — reuse the Back/Enter refs
         from the last read_page, the extension re-finds them if the portal re-rendered the toolbar
         (press_key("Enter") is only a fallback, it does not work on the real portal). Check the screenshot:
         the table must now show the next level. Back goes up one level. Call read_page once per level to get
         the new rows' refs; never re-read just to find Back/Enter.
      3. Walk down: the School (e.g. "School of Information Technology and Engineering") → the Instructor
         (Surname Name) → the course folder (name contains the course name; the code may be absent). If the
         instructor is unknown, look at the schools' instructor lists first or open "Student's schedule"
         (Year and Term selectors; the cell reads "CODE Course name Instructor room").
      4. Inside a course folder the files may be grouped in numbered subfolders ("1.Syllabus for the student",
         "2.Lectures", "3.Labs", …) — open each one that can contain files. Download EVERY file — one call per
         file: download(ref=<the row's download button ref, or the row itself>, path="<course code> <course
         name>/<folder>/<file name>") where <folder> is "Materials" for the syllabus and general files,
         "Week NN" for lecture NN, "Lab NN" for lab NN (two digits: Week 01, Lab 01). Keep the original file
         name. Prefer the row's download button (the icon-only button in the last cell, listed as
         button "download…" or "Download"); the row ref works too. Do not skip files: if the user asked only for
         changes, download anyway — the brain deduplicates by content. If download(ref) fails, do not call
         run_js or plain click — try the other ref once, then move on to the next file.
      5. After the last file call vault_list() and confirm every downloaded file is present with a summary.
      SOURCE ORDER — every course, no exceptions. A course's materials live in exactly one place and which one
      differs per course, so try the sources in this order and stop at the first that has them:
        1) the university portal, 2) Microsoft Teams (the course's class team), 3) the syllabus already in the
        vault (derive the week/lab material list from it).
      Give up on a source after 3 failed checks — a folder that is not there after three looks is not there —
      and move to the next source instead of widening the search inside the failed one. When a source works,
      remember("<course>: materials on <source> — <where exactly>") in one line; when a source has nothing,
      remember("<course>: nothing on <source>"). Next run, start from the remembered source and skip the ones
      remembered as empty. Never assume a course uses the same source as another course.
      Finish with a changelog: files added (with their vault paths), deadlines discovered, parse errors if any.
      Budget: about 10 actions to reach the course folder, ~4 per subfolder plus one per file — stay under 60;
      if the budget runs out, stop and report what was synced and what remains.
  - id: courseware
    key: "2"
    title: Build courseware from syllabus
    blurb: Cheatsheet + quiz per topic, generated from the syllabus and opened as a page.
    prompt: Build a cheatsheet and a quiz from the syllabus of the current course.
    keywords: [cheatsheet, cheat, quiz, courseware, revise, revision, exam]
    sites: [wsp.kbtu.kz]
    tools: [vault_list, vault_read, generate_courseware, download, download_many, open_tab, read_page, click, wait, screenshot]
    instructions: |
      Goal: ONE printable HTML page for the requested course - a cheatsheet plus a 10-question quiz with the
      answers folded away - opened in a tab and saved to the vault as
      "<course code> <course name>/Materials/courseware.html".
      Steps:
      1. vault_list(). Find the syllabus of the course the user named: an entry whose path contains the course
         and whose file name contains "syllabus" (e.g. "CSCI3240 Introduction to Computer Vision/Materials/
         syllabus.pdf"). Do not guess a path - use the one vault_list printed.
      2. If there is no such entry, sync it from WSP first, following the vault-sync playbook but downloading
         ONLY the syllabus: open_tab(<the portal URL from memory>/StudentFiles), read_page, then per level
         click the row and click the Enter button - School ("School of Information Technology and Engineering")
         -> Instructor (the course's instructor; the schedule page tells you who) -> the course folder -> the
         syllabus subfolder if there is one ("1.Syllabus for the student"). Then
         download(ref=<the syllabus row's download button ref>, path="<course code> <course name>/Materials/
         syllabus.pdf"). About 12 browser actions; verify each step on the screenshot before the next click.
         Follow the vault-sync playbook's SOURCE ORDER here: portal, then Microsoft Teams, then whatever the
         vault already holds - three failed checks end a source, and remember which one worked for the course.
      3. vault_read(<the syllabus path>) and keep the returned `text` as it is (it holds the weekly topic list).
         If `text` is empty, say so and stop - there is nothing to build courseware from.
      4. generate_courseware(course="<course code> <course name>", weeks=<the scope the user asked for, e.g.
         "all 15 weeks" or "weeks 1-5">, syllabus_text=<that text VERBATIM, not summarised>). It returns
         page_id, page_url, sections and questions. On status error, fix exactly what the message names (most
         often: the syllabus text was empty or was not the syllabus) and call it once more, at most twice.
      5. download(url=page_url, path="<course code> <course name>/Materials/courseware.html") - this saves the
         page to the Drive vault and indexes it. The brain's own pages are always navigable, no allow-list entry
         needed. Check the result: it must report bytes > 0 and a vault path.
      6. open_tab(page_url) so the user sees the page, then read_page once and verify the heading "Quiz" and the
         numbered questions are there.
      7. Finish with: the page URL, the vault path, how many sections and how many quiz questions.
      Budget: about 16 browser actions in total (only the syllabus sync browses); generate_courseware and the
      vault tools are server tools and cost nothing from that budget.
  - id: scaffold
    key: "3"
    title: Scaffold vault folders
    blurb: Per course, per week, per lab — folder tree initialized in Drive from the syllabus schedule.
    prompt: Create the vault folder structure for this semester from my syllabi.
    keywords: [scaffold, folders, folder, structure, tree, weeks]
    sites: [wsp.kbtu.kz]
    tools: [vault_list, vault_read, plan_vault_folders, make_folders, open_tab, read_page, click, download, wait, screenshot]
    instructions: |
      Goal: the requested course's folder tree exists in the Drive vault - "<course code> <course name>/"
      with "Materials", one "Week NN - <topic>" per week of the syllabus schedule and one "Lab NN - <topic>"
      per lab. At least 15 week folders: a KBTU semester is 15 weeks.
      Steps:
      1. vault_list(). Find the syllabus of the course the user named: an entry whose path contains the
         course and whose file name contains "syllabus" (e.g. "CSCI3240 Introduction to Computer Vision/
         Materials/syllabus.pdf"). Use the path vault_list printed, never a guessed one.
      2. If there is no such entry, sync it from WSP first, following the vault-sync playbook but downloading
         ONLY the syllabus: open_tab(<the portal URL from memory>/StudentFiles), read_page, then per level
         click the row and click the Enter button - School ("School of Information Technology and Engineering")
         -> Instructor (the course's instructor; the schedule page tells you who) -> the course folder -> the
         syllabus subfolder if there is one ("1.Syllabus for the student"). Then
         download(ref=<the syllabus row's download button ref>, path="<course code> <course name>/Materials/
         syllabus.pdf"). About 12 browser actions; check each screenshot before the next click.
         Follow the vault-sync playbook's SOURCE ORDER here: portal, then Microsoft Teams, then whatever the
         vault already holds - three failed checks end a source, and remember which one worked for the course.
      3. vault_read(<that syllabus path>) and keep the returned `text` exactly as it is - it holds the weekly
         schedule ("Week 01: ...") and the lab list ("Lab 01: ..."). If `text` is empty, say so and stop.
      4. plan_vault_folders(course_code="<e.g. CSCI3240>", course_name="<e.g. Introduction to Computer
         Vision>", syllabus_text=<that text VERBATIM, not summarised>). It returns {paths} - the complete
         list of vault-relative folder paths. Do not edit, shorten, re-order or re-word them.
      5. make_folders(paths=<the paths from step 4, verbatim, ALL of them in ONE call>). It creates the
         folders in Drive and returns {created, existing, failed, folders, root}. Verify
         created + existing == the number of paths you sent; if `failed` is non-empty, call make_folders once
         more with only the failed paths. Never pass a file name and never prefix "Dayflow/" - the extension
         puts the paths under the user's vault folder itself.
      6. Finish with: the course folder, how many week and lab folders now exist, and any path that failed.
      Budget: about 14 browser actions (only the syllabus sync browses); vault_list, vault_read and
      plan_vault_folders are server tools and cost nothing from that budget.
  - id: lab
    key: "4"
    title: Solve a lab from the vault
    blurb: Read the lab PDF (or the syllabus), solve every task with code that is actually run, deliver a notebook to Colab/Drive or a private repo.
    prompt: Solve Assignment 4 of my Programming Principles II course as a notebook and open it in Google Colab.
    keywords: [lab, labs, notebook, ipynb, colab, jupyter, solve, assignment, assignments, homework, exercise, exercises]
    sites: [github.com, colab.research.google.com]
    tools: [vault_list, vault_read, solve_lab_task, build_notebook, build_report, create_repository, push_files, download, open_tab, read_page, click, press_key, wait, screenshot, remember]
    instructions: |
      Goal: a runnable notebook (outputs included) for the requested lab, delivered where the user asked —
      Google Colab (default: the .ipynb saved to the Drive vault and opened in Colab) or a private GitHub repo
      (when the user says "repo", "GitHub" or "push") — plus a report saved to the vault.
      Plan first, then:
      1. vault_list(). Look for the lab file (e.g. "Lab_01_Image_Basics.pdf", "Assignment 4", a course repo
         bundle like "programming-principles-2-main.zip") and, failing that, the course's syllabus (path contains
         the course, file name contains "syllabus"). vault_read the best one.
         · Lab file found → its numbered tasks are the tasks.
         · A .zip bundle → vault_read returns a "[zip] …" listing followed by "[file <path>]" sections; the
           requested assignment is the section(s) under "Assignment NN/" (README.md plus its topic files such as
           generators.md, math.md). Use every numbered item of those files as the tasks, in file order; skip
           items that are not programs (install git, register on a site, read an article) and say so.
         · Only the syllabus found → build Lab NN from it: the topics of week NN (and the lab list if it has one)
           become 4-5 concrete tasks with sample data described in the task text (numpy only). Tell the user
           the tasks are derived from the syllabus, not from an official lab sheet.
         · Neither found → sync ONLY what this lab needs from WSP per the vault-sync playbook: Student files →
           School → Instructor → course folder → the assignments/labs subfolder ("4. Assignments", "3.Labs",
           "Practice") → download the lab sheet or the bundle (e.g. programming-principles-2-main.zip) to
           "<course code> <course name>/Lab NN/<file>"; if there is no such folder, download the syllabus from
           "1.Syllabus for the student" instead. About 12 browser actions; do not download lectures.
           SOURCE ORDER — courses differ, so try in this order and stop at the first that has the material:
           1) the university portal, 2) Microsoft Teams (the class team's Assignments/files), 3) the syllabus
           already in the vault, from which you derive the tasks. Give up on a source after 3 failed checks
           (instructor missing, course folder missing, nothing under the assignments folder) and move to the
           next one instead of searching wider inside it. remember("<course>: materials on <source> — <where>")
           when a source works and remember("<course>: nothing on <source>") when it does not, so the next run
           goes straight to the right one. If all three fail, ask the user for the lab sheet — never build
           tasks from nothing.
      2. Split the text into the shared setup (imports, sample data, constraints) and the numbered tasks.
      3. For EACH task call solve_lab_task(task_text=<the task verbatim>, context=<setup + course and lab name
         + constraints such as "standard library only" or "numpy only"; for tasks that read input from the
         console say "use a fixed sample value instead of input() and print it">). Keep its code, stdout and
         notes. On an error call it again with the error appended to the context (at most twice per task).
      4. build_notebook(title, cells): per task a short markdown cell (task title) then a code cell
         {source: code, stdout: stdout}. The brain re-runs the notebook; on an error fix that task and rebuild.
         It returns ipynb_json, ipynb_url and file_name.
      5. build_report(course, lab, tasks=[{title, approach, result, code}], summary) → markdown + page_url.
      6. Deliver:
         · Colab/Drive (default): download(url=<ipynb_url>, path="<course code> <course name>/Lab NN/lab<NN>.ipynb")
           — check bytes > 0 and note drive_file_id; then open_tab("https://colab.research.google.com/drive/
           <drive_file_id>") so the notebook is open in Colab (Colab reads it from the user's Drive; no clicking
           needed on that page). If drive_file_id is null (no Drive sign-in), say so and give the ipynb_url instead.
         · GitHub: create_repository(name like "csci3240-lab01", private=true), then ONE push_files(owner, repo,
           branch="main", message, files=[README.md (course, lab, how to run), TODO.md (5+ remaining
           improvements), lab01.ipynb (ipynb_json verbatim), REPORT.md (markdown verbatim),
           requirements.txt ("numpy" and "jupyter"), .gitignore]).
      7. download(url=page_url, path="<course code> <course name>/Lab NN/REPORT.html") saves the report to the
         vault (the brain's own pages are always navigable).
      Finish with: where the notebook is (Colab link or repo URL), the report page URL, the vault paths, tasks
      solved / failed, and whether the tasks came from a lab sheet or the syllabus.
      Budget: about 3 browser actions when the lab or syllabus is already in the vault; up to ~15 when the
      syllabus must be synced first.
  - id: team-ops
    key: "5"
    title: "Team ops: Telegram → Linear → GitHub"
    blurb: Post an update to the diploma chat, file Linear issues, open a GitHub issue + PR.
    prompt: Post this week's update to the diploma project chat, create Linear issues for the next milestone, and open the PR.
    keywords: [telegram, linear, issue, issues, pr, pull, update, team, diploma, chat]
    sites: [web.telegram.org, linear.app, github.com]
    tools: [get_file_contents, open_tab, read_page, click, type, press_key, wait, screenshot, request_confirmation, list_teams, list_projects, create_issue, issue_write, create_branch, push_files, create_pull_request]
    instructions: |
      Goal: the weekly update posted in the team chat (only after the user approved the exact text), two
      Linear issues for the next milestone, and a GitHub issue + exactly one pull request on the diploma repo.
      The repo is "<owner>/<repo>" from the prompt or memory (default dayflow-student/diploma); the chat is the
      one named in the prompt (default "Diploma · Team"); the messenger is the URL in the prompt, else the one
      in the site notes in scope (Telegram Web: https://web.telegram.org/k/).
      Order of work: get_file_contents (README, TODO) → open_tab the messenger → read_page → click the chat row
      → request_confirmation → type(the update, submit=true) → list_teams / list_projects → create_issue ×2 →
      issue_write → create_branch + push_files → create_pull_request (exactly one).

      APPROVAL RULE — read this before you act; every gated call depends on it.
      Sending the message and creating the issues and the pull request are gated. Each of those calls needs its
      OWN confirmation card in the turn before it — one gated call per confirmation — and the card's `details`
      must carry that call's content arguments verbatim:
        · sending the update    → details = the message text, i.e. exactly the string you pass as `text`.
        · a Linear issue        → details = the title, a blank line, then the description — exactly the strings
                                  you pass as `title` and `description`.
        · the GitHub issue      → details = the title, a blank line, then the body (`title`, `body`).
        · the pull request      → details = the title, a blank line, then the body (`title`, `body`).
      Write each piece of content ONCE, then copy it verbatim into the card and into the call: same wording,
      same punctuation, same characters. Re-wording, re-wrapping, translating, adding a heading or dropping a
      sentence between the card and the call makes the call fail with "the ... differ from what the user
      approved". One approval buys exactly ONE call and is spent when that call runs.
      Never put a confirmation and a gated call in the same turn, and never two gated calls in the same turn:
      confirm → wait for {"confirmed": true} → make the one call. If a gated call is refused for a missing
      approval, do not repeat it blindly: ask again with details that are the exact argument strings of that
      call, then repeat the call verbatim.

      Steps, in this order, one tool call per turn:
      1. get_file_contents(owner, repo, path="README.md") and get_file_contents(owner, repo, path="TODO.md").
      2. Draft UPDATE from them: 2-3 sentences in ONE plain-text paragraph (no markdown, no bullet characters,
         no line breaks), under 400 characters — what was done this week, what is next (the next milestone = the
         first still-open TODO items), one ask or date. Keep this exact string: the card and the send call both
         use it verbatim.
      3. open_tab(<messenger URL>), then read_page. The chat list is the left column; each row shows the chat
         name and its last message. If "<chat name>" is not listed, type its name into the search box at the top
         of that column and read_page again.
      4. click the chat row whose label contains the chat name, then read_page: the header of the right column
         must show that chat name, and the composer (the "Message" textarea or contenteditable at the bottom)
         and the Send button must be in the element list. Note the composer's ref. Do not type yet. If that chat
         was already open when the page loaded, you may skip the click and use the refs you already have.
      5. request_confirmation(action="Send message to '<chat name>'", details=UPDATE).
      6. After {"confirmed": true}: type(ref=<the composer ref>, text=UPDATE, submit=true) — ONE call; it types
         the text and presses Enter, which sends it. Then read_page once: UPDATE must now be the last outgoing
         bubble of the thread. If it is still only in the composer, click the Send button and read_page again.
         Send it once and once only. Leave the chat tab open until the run ends.
      7. Linear: list_teams() for the team id, then list_projects(teamId) for the id of the diploma project.
      8. First Linear issue: choose a concrete title and a 2-3 line description for the first next-milestone
         task, then request_confirmation(action="Create Linear issue", details=<that title, blank line, that
         description>); after the answer, create_issue(title=<that title>, teamId=<the id>, description=<that
         description>, projectId=<the id>).
      9. Second Linear issue: repeat step 8 for the second next-milestone task (new title and description).
      10. GitHub issue: request_confirmation(action="Open GitHub issue", details=<title, blank line, body>),
          then issue_write(method="create", owner=..., repo=..., title=<that title>, body=<that body>) — the
          issue tracks the milestone and links the Linear identifiers.
      11. create_branch(owner, repo, branch="weekly-update-<YYYY-MM-DD>"), then push_files(owner, repo,
          branch=<that branch>, message=<commit message>, files=[{path: "docs/updates/<YYYY-MM-DD>.md",
          content: <UPDATE plus the issue links>}]).
      12. Pull request: request_confirmation(action="Open pull request", details=<title, blank line, body>),
          then ONE create_pull_request(owner, repo, title=<that title>, head=<that branch>, base="main",
          body=<that body>). Exactly one pull request per run — never call it twice.
      13. Finish with: the update text and the chat it went to, the Linear identifiers + URLs, the GitHub issue
          URL and the pull request URL.
      Budget: about 6 browser actions in total (open_tab, read_page, click, read_page, type, read_page); the
      confirmations and the GitHub/Linear tools are server-side and cost nothing from that budget.
  - id: pitch-deck
    key: "6"
    title: Pitch deck from repo
    blurb: A 16:9 .pptx pitch about the diploma project, built from its README/TODO, saved to the vault with an HTML preview.
    prompt: Build a pitch deck about my diploma project repo, save it to my vault and open the preview.
    keywords: [pitch, deck, slides, presentation, pptx, powerpoint]
    sites: [github.com]
    tools: [get_file_contents, build_deck, download, open_tab, vault_list]
    instructions: |
      Goal: a real PowerPoint deck (.pptx, 16:9, at least 6 slides) about the repo, stored in the vault, with
      its HTML preview open in a tab. The repo is "<owner>/<repo>" from the prompt or memory (default
      dayflow-student/diploma). No browsing is needed to gather the content: the GitHub tools read the repo.
      Steps:
      1. get_file_contents(owner=<owner>, repo=<repo>, path="README.md"), then get_file_contents(owner=<owner>,
         repo=<repo>, path="TODO.md"). Use ONLY what those files say (what the project does, its stack and
         architecture, what already works, what is still open) — never invent numbers, users or traction. If a
         file is missing, continue with the other one.
      2. Draft an 8-section outline in this order: Problem, Users, Solution, Demo, Architecture, Progress,
         Plan, Ask. Each section = one heading plus 2-4 bullets; each bullet a phrase under ~90 characters
         grounded in the README/TODO (Progress = what the README says works; Plan = the first open TODO items).
      3. build_deck(title="<project> - <one-line positioning>", subtitle="<owner>/<repo>",
         outline=[{"heading": "Problem", "bullets": ["...", "..."]}, ... all 8 entries]). It returns
         {id, slides, preview_url, pptx_url}. Verify slides >= 6; if it returns status "error" (too few
         sections, missing heading), fix the outline and call it once more. Do not build the file yourself.
      4. download(url=<pptx_url>, path="<repo>/pitch/diploma-pitch.pptx") — this saves the .pptx into the Drive
         vault and indexes it on the brain. The brain's own pages are always navigable, so no allow-list change
         is needed. Check the result: bytes must be > 0 and vault_id must not be null.
      5. download(url=<preview_url>, path="<repo>/pitch/diploma-pitch.html") — keeps the preview beside the deck
         and shows the user a clickable link to the live page.
      6. open_tab(<preview_url>) so the slides are on screen. Do not click anything on that page.
      Finish with: the deck title, the slide count, the vault path of the .pptx and the preview URL.
      Budget: 3 browser actions in total (two downloads and one open_tab); get_file_contents and build_deck are
      server tools and cost nothing from that budget.
  - id: standing-watch
    key: "7"
    title: Watch attendance and grade standing
    blurb: Reads each course's attendance percentage and grade standing on the portal and warns only when a number is near the exam bar.
    prompt: Check my attendance and grades and tell me what needs attention this week.
    keywords: [attendance, absences, absence, attend, skipped, grades, grade, gpa, standing, barred, watch]
    sites: [wsp.kbtu.kz]
    # Read-only by design: no download, no type, no run_js, no GitHub/Linear/vault writes. This skill warns; it never acts.
    tools: [open_tab, read_page, click, scroll, wait, screenshot, remember]
    # Sunday evening, before the week starts — the warning is only useful while there are still classes to attend.
    schedule: "0 20 * * 0"
    instructions: |
      Goal: for every enrolled course, today's attendance percentage and grade standing, compared against the
      thresholds AND against what you saw last run, reported as a handful of actionable lines. This skill only
      reads and warns: it has no download, no type and no write tools — never try to change anything.
      Why it matters: below 70% attendance the student is barred from the final exam, and the portal never
      warns anyone. The number is worthless without the consequence — always report both.
      Thresholds:
        · attendance < 71% → ALARM. State how many absences are left before the bar.
        · attendance < 75% → WARN. State the number and that the next absences decide it.
        · a drop of 3 points or more since the figure you remember → report it even above 75%.
        · otherwise → silence. Do not report a healthy course beyond one closing tally line.
      Steps:
      1. Read "What you remember" first: lines like "<course>: attendance 78%, grade 74 (2026-08-20)" are last
         run's figures and the list of courses. Do not browse for a fact you already remember.
      2. open_tab(<the portal URL from memory>/Attendance), read_page. The view lists the enrolled courses of
         the current term with a percentage (or "attended / total" — then the percentage is attended/total×100,
         rounded to one decimal). If the term shown is not the current one, use the Year/Term selectors. If a
         course row has a details/expand control and its number is not on the list, click it once.
      3. open_tab(<the portal URL>/StudentJournal), read_page for the same courses' grade standing (current
         total and midterm marks as printed). Never compute a GPA yourself — report the figures the portal shows.
      4. Per course compare against the thresholds and against the remembered figure; note the delta.
      5. remember("<course code> <course name>: attendance <N>%, grade <standing> (<today's date>)") — one call
         per course, one short line, so the next run can report the delta. One line per course, not a history.
      6. Report ONLY the actionable courses, each one line, number first, then the consequence:
         "Computer Vision: 71.2% attendance. Two more absences and you cannot sit the final."
         "Databases: attendance fell 82% → 76% this week; grade standing 68."
         Close with one tally line for the rest ("4 other courses at 85%+, nothing to do"). If nothing is
         actionable, say exactly that in one sentence and stop — no table, no per-course recap.
      GIVE-UP RULE: at most 3 lookups per course. If a course's figure is not on the attendance view, not in
      the journal and not behind one details click, stop looking for that course, remember("<course>: no
      attendance figure on the portal"), and list it under "could not read" in the report. Never open other
      modules, other terms or other courses' pages hoping to find it.
      Budget: about 6 browser actions in total (two open_tabs, two read_pages, at most two detail clicks);
      remember costs nothing from that budget.
sites:
  - domain: wsp.kbtu.kz
    mode: dom
    notes: |
      KBTU student portal (Vaadin app: no real links, navigate by clicking; take a fresh read_page after every click).
      The UI may be in Russian: title "Офис регистратора" = Office of the Registrar, Back = "Назад", Enter = "Войти",
      "Школа информационных технологий и инженерии" = School of Information Technology and Engineering, and instructor
      names may be written in Cyrillic ("Келгенбаев Арнұр" = Kelgenbayev Arnur) — match by transliteration.
      Top-right flag icon (img src gb.png) switches the UI to English; the home icon (img src home.png) opens the Desktop,
      which lists modules as links: Student files, Student's schedule, Attendance mark, Student's Journal, Transcript,
      Student exam schedule, Registration for disciplines, News.
      Student files (/StudentFiles) is a folder browser: a table of rows plus Back and Enter buttons. The tree is
      School > Instructor (Surname Name) > course folder > numbered subfolders (1.Syllabus for the student, 2.Lectures,
      3.Labs, …) > files. Select a row by clicking it, then click the Enter button (keyboard Enter does not open
      folders here; reuse the Back/Enter refs from the last read_page — they are re-found after re-renders);
      Back goes up. A file row does not download when clicked: its last cell holds an icon-only download button —
      call download(ref=<the row's ref>) and the extension presses that icon itself (it is hidden until hovered and
      may sit outside the visible columns; the extension scrolls to it — never resize the window, never click_at
      the scrollbar, never use run_js to find it).
      Student's schedule (/StudentSchedule) is a weekly grid; cells read "CODE Course name Instructor room (hh:mm-hh:mm)";
      it has Year and Term selectors - use them to see past semesters. Read the schedule first to learn each course's instructor.
      Module URLs (after sign-in): /StudentFiles (files), /StudentSchedule (schedule), /Attendance, /StudentJournal
      (grades), /Transcript, /News — open_tab the URL directly instead of clicking through the Desktop.
      Not every course has files here: an instructor who publishes on Teams or by e-mail has no folder under their
      school. If the instructor is not in the school's list (or the course is not in the instructor's folder), that is
      the answer — go Back once to double-check the school, then stop, remember it, and report; never scan other
      schools or instructors hoping to find it.
  - domain: teams.microsoft.com
    # vision: the Teams shell is DOM-readable, but everything that holds course material (Assignments, the Shared
    # file lists) is a cross-origin iframe whose rows read_page cannot see — so look at the screenshot, always.
    mode: vision
    notes: |
      Microsoft Teams web (new "v2" UI, https://teams.microsoft.com/v2/). THE UI MAY BE ENTIRELY IN RUSSIAN — match
      labels by either language. Left rail: Activity/Действия, Chat/Чат, Teams/Команды, Assignments/Задания,
      Calendar/Календарь, Calls, OneDrive, Apps. Top search box (placeholder "Press Ctrl+Alt+G…"): typing a course
      name lists matching FILES with their team and channel ("Syllabus ….docx — Computer vision spring'26 > General")
      — the fastest way to locate a course document; Enter shows all results with Files / Channels / Messages filters.
      Teams page: class teams are usually under a collapsed "Hidden"/"Скрытые" group — click it to expand, then the
      team. A class team's left tree: Home page/Главная, Class Notebook/Записная книжка класса,
      Classwork/Классная работа, Assignments/Задания, Grades/Оценки, Reflect, then the channels ("General"/"Общий", under
      "Hidden channels"/"Скрытые каналы"). A channel has tabs Posts/Публикации and Shared/Общий доступ (its files).
      ASSIGNMENTS (Задания) is an EDU app rendered INSIDE AN IFRAME (assignments.edu.cloud.microsoft), not part of
      the Teams page: read_page does not list its rows. Its tabs are Предстоящие / Просрочено / Выполнено
      (Upcoming / Overdue / Completed) — Просрочено is where a missed lab hides. Read the tab strip and the
      assignment titles off the SCREENSHOT and click_at them.
      IFRAMES — the rule for this whole site: prefer reading an iframe's `src` and opening that URL as a normal
      top-level tab (open_tab) over trying to act inside the frame. read_page lists the iframe element itself with
      its src even when it cannot see through it; a top-level tab is DOM-readable, downloadable and much cheaper.
      Only fall back to screenshot + click_at inside the frame when there is no usable src.
      ATTACHMENTS inside an assignment resolve to SharePoint URLs (…sharepoint.com/…/_layouts/15/Doc.aspx? or
      …/Shared%20Documents/…). Open such a URL top-level and download it from the viewer's Download/Скачать button
      (download(ref=…) once read_page shows it) into "<course code> <course name>/Lab NN/<file>". The same is true
      of the Shared/Общий доступ tab: it is a SharePoint filebrowser.aspx iframe — open the SharePoint URL instead
      of fighting the frame.
      Do not click_at blindly on rows you have not seen on a screenshot. If the file cannot be obtained in ≤5
      actions, stop, remember which team/channel/assignment holds it, and ask the user to drop it into the vault.
  - domain: web.telegram.org
    mode: dom
    notes: |
      Telegram Web (K version, https://web.telegram.org/k/). The user is signed in; never touch the phone/code
      login. The chat list is the left column with a search input at its top: typing a name filters the list,
      and the chat rows show the chat name and its last message — click the row to open the chat (the header at
      the top of the right column then shows that chat's name). The message composer is a contenteditable div
      ("Message") at the bottom of the open chat with the Send button to its right; type(ref, text, submit=true)
      enters the text and presses Enter, which sends (or click Send). After sending, the message appears as the
      last outgoing bubble at the bottom of the thread — read_page to verify it. Never send without
      request_confirmation whose `details` are the message text character for character (the approval only
      covers that exact string, and the `type` call that follows must pass it unchanged); never send twice.
      A stand-in messenger (a plain /chat page on another host) works the same way: search box and chat rows
      on the left, a "Message" textarea plus a Send button on the right — the composer may be a textarea
      instead of a contenteditable, and type(ref, text, submit=true) sends in both cases.
  - domain: github.com
    mode: dom
    notes: |
      GitHub. Prefer the GitHub tools (create_repository, push_files, issue_write, create_pull_request) over
      clicking; open the resulting URLs in a tab to show the user.
  - domain: drive.google.com
    mode: vision
    notes: |
      Google Drive web UI is canvas-heavy: work from screenshots and click_at coordinates. Files the agent saved
      live under the "Dayflow" folder; double-click opens a file in Docs/Slides.
permissions:
  # The brain's own host (DAYFLOW_PUBLIC_URL) is always navigable for its report/courseware pages; this entry only
  # matters when the pack is used against a brain whose public URL is not configured.
  allowed_hosts: [wsp.kbtu.kz, teams.microsoft.com, web.telegram.org, github.com, linear.app, drive.google.com, docs.google.com, colab.research.google.com, dayflow-brain-lrqhed2z5a-ez.a.run.app]
  # run_js evaluates arbitrary JavaScript on an allow-listed page with the user's session: the full expression is
  # shown on the confirmation card before it runs.
  ask_before: [type, create_pull_request, issue_write, create_issue, run_js]
  mode: ask
