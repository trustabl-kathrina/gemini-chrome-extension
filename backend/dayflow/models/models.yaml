# Role → model id. Swap models here, never in code.
orchestrator: gemini-3.7-flash
solver: gemini-3.7-flash   # lab solver sub-agent (needs Gemini code execution)
parser: gemini-3.5-flash-lite
classifier: gemma-4-26b-a4b-it
embed: gemini-embedding-2
embed_dims: 768
# Orchestrator thinking level (minimal|low|medium|high): browsing steps are small — LOW keeps turns fast.
thinking: low
# The first call of a run (the plan) and recovery after an error / unchanged page think harder.
thinking_plan: medium
# Optional cheaper model for routine browser steps (e.g. gemini-3.5-flash); planning/recovery stay on the orchestrator.
executor: ""
solver_thinking: medium
# Screenshot detail the model gets (Gemini 3: low ≈ 280 tokens/image, medium ≈ 560, high ≈ 1120). Sites in vision
# mode (act by coordinates) always get high; dom-mode sites verify with the picture and read text via read_page.
image_resolution: low
# When the orchestrator model answers 429 RESOURCE_EXHAUSTED (Vertex capacity) after the retries, the same request is
# replayed on these, in order. gemini-3.7-flash is served from the global endpoint only (regional endpoints 404), so
# the fallback is another model. DAYFLOW_FALLBACKS overrides (comma-separated; empty disables).
fallbacks: [gemini-3.5-flash]
