[project]
name = "dayflow"
version = "0.1.0"
description = "Dayflow brain: Google ADK agent server (brain / worker / scheduler) for the Dayflow Chrome extension."
requires-python = ">=3.12"
dependencies = [
    "google-adk>=2.7.1,<3",
    "google-cloud-firestore>=2.11,<3",
    "google-genai>=2.12.1,<3",
    "fastapi>=0.133,<1",
    "uvicorn>=0.34,<1",
    "pydantic>=2.12,<3",
    "pyyaml>=6",
    "httpx>=0.27",
    "mcp>=1.10,<2",
    "google-cloud-storage>=2.18,<4",
    "python-multipart>=0.0.9",
    "pypdf>=5",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pyright>=1.1.390",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "types-pyyaml",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "dayflow"
module-root = ""

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.pyright]
include = ["dayflow", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingModuleSource = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
