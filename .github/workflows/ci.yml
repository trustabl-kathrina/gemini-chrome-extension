# `make verify` on every push and PR: ruff + pyright + pytest (backend), tsc + vitest (extension),
# node --test (fake Drive self-test). No Google Cloud credentials are available here and none are
# needed — every test runs against in-process fakes. `make e2e` is deliberately NOT run in CI: it
# needs a headed Chromium, the built extension and a real Gemini endpoint (Vertex AI + ADC).
name: verify

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Backend: uv installs Python 3.12 itself (backend/.python-version).
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.11.26'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: uv sync
        run: uv sync --frozen
        working-directory: backend

      # Extension: Node ≥ 22.18 (the harness imports the extension's TypeScript natively) + pnpm 10.
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
          cache: pnpm
          cache-dependency-path: extension/pnpm-lock.yaml
      - name: pnpm install
        run: pnpm install --frozen-lockfile
        working-directory: extension

      - name: make verify
        run: make verify
        env:
          PYTHONPATH: ''
